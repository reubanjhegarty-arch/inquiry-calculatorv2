<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inquiry Calculator</title>
<meta name="description" content="A new way to work out the numbers. Inquiry Calculator starts with a basic calculator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f1eeea; --ink:#151515; --ink-soft:rgba(21,21,21,.62); --line:rgba(21,21,21,.08);
  --blue:#3f82e0; --sel:#ee7a4b; --pill:#1d1d20; --key:#2b2c31; --key-fn:#3b3c43;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- Stage ---------- */
.stage{position:relative;overflow:hidden;min-height:max(860px,100svh);text-align:center}
.stage::before{ /* drafting grid, fading out from the centre */
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:36px 36px;
  -webkit-mask-image:radial-gradient(ellipse 36% 42% at 50% 56%,#000,transparent);
          mask-image:radial-gradient(ellipse 36% 42% at 50% 56%,#000,transparent);
}
.stage::after{ /* paper grain */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ---------- Floating pill nav ---------- */
.nav{position:fixed;top:12px;left:0;right:0;z-index:20;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.nav-in{
  pointer-events:auto;display:flex;align-items:center;gap:6px;width:min(860px,100%);height:54px;
  padding:0 8px 0 22px;background:var(--pill);border-radius:18px;color:#fff;box-shadow:0 14px 40px -18px rgba(0,0,0,.5);
}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.95rem;letter-spacing:-.01em;white-space:nowrap;margin-right:auto;color:#fff;text-decoration:none}
.tab{padding:8px 14px;border-radius:10px;font-size:.88rem;color:rgba(255,255,255,.62);white-space:nowrap;background:none}
.tab.on{color:#fff;background:rgba(255,255,255,.1)}
.tab[aria-disabled="true"]{cursor:default}
.cta{margin-left:8px;padding:10px 18px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600;font-size:.9rem;text-decoration:none;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}

/* ---------- Headline ---------- */
.title-wrap{position:absolute;top:116px;left:0;right:0;z-index:1;will-change:translate}
h1{font-family:var(--display);font-weight:800;font-size:clamp(68px,15vw,250px);line-height:.88;letter-spacing:-.05em;white-space:nowrap}

/* ---------- Sketches ---------- */
.sketch{position:absolute;z-index:2;color:var(--ink);will-change:translate}
.sketch svg{display:block;width:100%;height:auto;overflow:visible}
.hatch{stroke-width:1.4;opacity:.65}
.sk-left{left:1%;top:330px;width:min(25vw,360px);rotate:-5deg}
.sk-right{right:2%;top:300px;width:min(20vw,290px);rotate:6deg}

/* ---------- Calculator in a selection box ---------- */
.canvas{position:absolute;z-index:3;top:236px;left:50%;margin-left:calc(var(--w)/-2);width:var(--w);--w:min(86vw,356px);will-change:translate,transform}
.sel{position:relative;padding:16px;border:2px solid var(--sel)}
.sel i{position:absolute;width:11px;height:11px;background:var(--paper);border:2px solid var(--sel)}
.sel .tl{left:-7px;top:-7px}.sel .tr{right:-7px;top:-7px}.sel .bl{left:-7px;bottom:-7px}.sel .br{right:-7px;bottom:-7px}

.calc{background:linear-gradient(155deg,#45464d,#17171a);border-radius:28px;padding:18px;box-shadow:0 30px 60px -28px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.12)}
.screen{background:#0b0c0e;border-radius:14px;padding:12px 16px 10px;margin-bottom:14px;text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.expr{min-height:1.2em;font-size:.88rem;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font-size:2.6rem;font-weight:600;letter-spacing:-.03em;color:#c5ccff;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.k{height:54px;border-radius:12px;background:var(--key);color:#fff;font-size:1.2rem;font-weight:500;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);transition:filter .12s,transform .08s}
.k:hover{filter:brightness(1.18)}
.k:active,.k.press{transform:scale(.95);filter:brightness(1.3)}
.k.fn{background:var(--key-fn);color:#e8e8ec}
.k.op{background:var(--blue)}
.k.eq{background:var(--sel)}
.k.wide{grid-column:span 2}

/* ---------- Footer line ---------- */
.foot{position:absolute;left:0;right:0;bottom:34px;z-index:4;padding:0 24px}
.tag{font-size:clamp(1.05rem,1.6vw,1.35rem);margin-bottom:10px}
.hint{font-size:.85rem;color:var(--ink-soft)}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;padding:1px 6px;border:1px solid currentColor;border-radius:5px}

/* ---------- Small screens ---------- */
@media (max-width:820px){
  .stage{min-height:0;padding:104px 16px 40px}
  .title-wrap,.canvas,.foot{position:relative;top:auto;left:auto;right:auto;bottom:auto;padding:0}
  h1{white-space:normal;font-size:clamp(64px,22vw,120px)}
  .canvas{margin:28px auto 0}
  .sketch{display:none}
  .foot{margin-top:36px}
  .tab{display:none}
}
@media (prefers-reduced-motion:reduce){.title-wrap,.sketch,.canvas{translate:none!important;transform:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="2.2"/>
  </filter>
</defs></svg>

<header class="nav">
  <div class="nav-in">
    <a class="logo" href="#top">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 10h16"/><path d="M10 4v16"/></svg>
      Inquiry Calculator
    </a>
    <span class="tab on">Basic</span>
    <span class="tab" aria-disabled="true" title="Coming soon">Scientific</span>
    <span class="tab" aria-disabled="true" title="Coming soon">Finance</span>
    <a class="cta" href="#calc">Try it out</a>
  </div>
</header>

<main class="stage" id="top">

  <div class="title-wrap" data-depth="-0.2"><h1>Work it out.</h1></div>

  <!-- left: pencil and ruler -->
  <figure class="sketch sk-left" data-depth="0.5" aria-hidden="true">
    <svg viewBox="0 0 260 210" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#wobble)">
      <g transform="rotate(-12 130 150)">
        <rect x="14" y="118" width="226" height="42" rx="4"/>
        <path d="M38 118v15M62 118v9M86 118v15M110 118v9M134 118v15M158 118v9M182 118v15M206 118v9"/>
        <path class="hatch" d="M24 150l14-14M60 156l16-16M110 156l16-16"/>
      </g>
      <g transform="rotate(-28 130 60)">
        <rect x="30" y="38" width="150" height="24" rx="3"/>
        <path d="M54 38v24M68 38v24"/>
        <path d="M180 38l38 12-38 12z"/><path d="M208 47l12 3-12 3"/>
        <path class="hatch" d="M80 62l16-24M104 62l16-24M128 62l16-24"/>
      </g>
    </svg>
  </figure>

  <!-- right: abacus -->
  <figure class="sketch sk-right" data-depth="0.5" aria-hidden="true">
    <svg viewBox="0 0 240 220" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#wobble)">
      <rect x="16" y="14" width="208" height="192" rx="10"/>
      <path d="M16 56H224M16 98H224M16 140H224M16 182H224"/>
      <circle cx="44" cy="56" r="12"/><circle cx="70" cy="56" r="12"/><circle cx="184" cy="56" r="12"/>
      <circle cx="44" cy="98" r="12"/><circle cx="150" cy="98" r="12"/><circle cx="176" cy="98" r="12"/><circle cx="202" cy="98" r="12"/>
      <circle cx="44" cy="140" r="12"/><circle cx="70" cy="140" r="12"/><circle cx="96" cy="140" r="12"/><circle cx="202" cy="140" r="12"/>
      <circle cx="44" cy="182" r="12"/><circle cx="176" cy="182" r="12"/><circle cx="202" cy="182" r="12"/>
      <path class="hatch" d="M24 30l20-14M24 208l30-22"/>
    </svg>
  </figure>

  <!-- the calculator -->
  <section class="canvas" id="calc" data-depth="0.9" aria-label="Basic calculator">
    <div class="sel">
      <i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
      <div class="calc">
        <div class="screen" role="status" aria-live="polite">
          <div class="expr" id="expr"></div>
          <div class="val" id="val">0</div>
        </div>
        <div class="keys" id="keys">
          <button class="k fn" data-a="ac" aria-label="All clear">AC</button>
          <button class="k fn" data-a="neg" aria-label="Plus or minus">±</button>
          <button class="k fn" data-a="pct" aria-label="Percent">%</button>
          <button class="k op" data-o="/" aria-label="Divide">÷</button>
          <button class="k" data-n="7">7</button><button class="k" data-n="8">8</button><button class="k" data-n="9">9</button>
          <button class="k op" data-o="*" aria-label="Multiply">×</button>
          <button class="k" data-n="4">4</button><button class="k" data-n="5">5</button><button class="k" data-n="6">6</button>
          <button class="k op" data-o="-" aria-label="Subtract">−</button>
          <button class="k" data-n="1">1</button><button class="k" data-n="2">2</button><button class="k" data-n="3">3</button>
          <button class="k op" data-o="+" aria-label="Add">+</button>
          <button class="k wide" data-n="0">0</button>
          <button class="k" data-a="dot" aria-label="Decimal point">.</button>
          <button class="k eq" data-a="eq" aria-label="Equals">=</button>
        </div>
      </div>
    </div>
  </section>

  <div class="foot">
    <p class="tag">A new way to work out the numbers.</p>
    <p class="hint">Type it, or press <kbd>0–9</kbd> <kbd>+ − × ÷</kbd> <kbd>Enter</kbd> <kbd>Esc</kbd></p>
  </div>
</main>

<script>
/* ---------- Calculator ---------- */
(() => {
  const val = document.getElementById('val'), expr = document.getElementById('expr');
  const SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  let cur = '0', prev = null, op = null, fresh = true, err = false, last = '';

  const fmt = s => {
    if (err || /e/i.test(s)) return s;
    const neg = s[0] === '-', [i, d] = s.replace('-', '').split('.');
    return (neg ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (d !== undefined ? '.' + d : '');
  };
  const num = n => String(parseFloat(n.toPrecision(12)));
  const compute = (a, b, o) => o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : (b === 0 ? null : a / b);

  function show() {
    const t = fmt(cur);
    val.textContent = t;
    val.style.fontSize = t.length > 14 ? '1.5rem' : t.length > 11 ? '1.9rem' : t.length > 8 ? '2.2rem' : '2.6rem';
    expr.textContent = last || (op !== null ? `${fmt(num(prev))} ${SYM[op]}` : '');
  }
  function fail() { cur = "Can't divide by zero"; err = true; prev = null; op = null; fresh = true; last = ''; show(); }
  function reset() { cur = '0'; prev = null; op = null; fresh = true; err = false; last = ''; show(); }

  function digit(d) {
    if (err) reset();
    if (fresh) { cur = d; fresh = false; last = ''; }
    else if (cur.replace(/[-.]/g, '').length < 12) cur = cur === '0' ? d : cur + d;
    show();
  }
  function dot() {
    if (err) reset();
    if (fresh) { cur = '0.'; fresh = false; last = ''; }
    else if (!cur.includes('.')) cur += '.';
    show();
  }
  function setOp(o) {
    if (err) return;
    if (op !== null && !fresh) {
      const r = compute(prev, parseFloat(cur), op);
      if (r === null) return fail();
      cur = num(r);
    }
    prev = parseFloat(cur); op = o; fresh = true; last = ''; show();
  }
  function equals() {
    if (err || op === null) return;
    const a = prev, b = parseFloat(cur), r = compute(a, b, op);
    if (r === null) return fail();
    last = `${fmt(num(a))} ${SYM[op]} ${fmt(num(b))} =`;
    cur = num(r); prev = null; op = null; fresh = true; show();
  }
  function percent() { if (!err) { cur = num(parseFloat(cur) / 100); fresh = true; show(); } }
  function negate() { if (!err && cur !== '0') { cur = cur[0] === '-' ? cur.slice(1) : '-' + cur; show(); } }
  function back() {
    if (err) return reset();
    if (fresh) return;
    cur = cur.length > 1 && !(cur.length === 2 && cur[0] === '-') ? cur.slice(0, -1) : '0';
    show();
  }

  document.getElementById('keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.n) digit(b.dataset.n);
    else if (b.dataset.o) setOp(b.dataset.o);
    else ({ ac: reset, neg: negate, pct: percent, dot, eq: equals })[b.dataset.a]();
  });

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    let sel = null;
    if (/^[0-9]$/.test(k)) { digit(k); sel = `[data-n="${k}"]`; }
    else if ('+-*/'.includes(k)) { setOp(k); sel = `[data-o="${k}"]`; }
    else if (k === 'x' || k === 'X') { setOp('*'); sel = '[data-o="*"]'; }
    else if (k === '.' || k === ',') { dot(); sel = '[data-a="dot"]'; }
    else if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); sel = '[data-a="eq"]'; }
    else if (k === 'Escape' || k === 'c' || k === 'C') { reset(); sel = '[data-a="ac"]'; }
    else if (k === 'Backspace') { back(); }
    else if (k === '%') { percent(); sel = '[data-a="pct"]'; }
    if (sel) { const b = document.querySelector('#keys ' + sel); if (b) { b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 110); } }
  });
})();

/* ---------- Spatial effect: layers drift at different depths, calculator tilts ---------- */
(() => {
  const stage = document.getElementById('top');
  const calc = document.getElementById('calc');
  const layers = [...stage.querySelectorAll('[data-depth]')].map(el => ({ el, d: parseFloat(el.dataset.depth) }));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const small = matchMedia('(max-width: 820px)');
  if (reduce) return;
  let tx = 0, ty = 0, x = 0, y = 0, running = false;

  stage.addEventListener('pointermove', e => {
    const r = stage.getBoundingClientRect();
    tx = (e.clientX - r.left) / r.width - 0.5;
    ty = (e.clientY - r.top) / r.height - 0.5;
  });
  stage.addEventListener('pointerleave', () => { tx = 0; ty = 0; });

  function tick() {
    if (!running) return;
    x += (tx - x) * 0.08; y += (ty - y) * 0.08;
    const k = small.matches ? 0 : 1;
    layers.forEach(({ el, d }) => { el.style.translate = `${-x * d * 90 * k}px ${-y * d * 60 * k}px`; });
    calc.style.transform = `perspective(1100px) rotateY(${x * 9 * k}deg) rotateX(${-y * 7 * k}deg)`;
    requestAnimationFrame(tick);
  }
  new IntersectionObserver(([en]) => {
    if (en.isIntersecting && !running) { running = true; requestAnimationFrame(tick); }
    else if (!en.isIntersecting) running = false;
  }).observe(stage);
})();
</script>
</body>
</html>
